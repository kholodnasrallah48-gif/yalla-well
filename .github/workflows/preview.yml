# Publishes the app to Expo on every push to main so it opens in Expo Go on a phone.
# Needs the repository secret EXPO_TOKEN (expo.dev > Account settings > Access tokens).
name: Preview on phone

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Check EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::warning::Add the EXPO_TOKEN secret to publish to Expo Go."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - uses: expo/expo-github-action@v8
        if: env.SKIP != '1'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Link the Expo project
        if: env.SKIP != '1'
        run: |
          eas init --non-interactive --force
          eas update:configure --platform all --non-interactive
      - name: Publish update
        if: env.SKIP != '1'
        run: |
          eas update --branch preview --message "${{ github.event.head_commit.message || 'manual run' }}" --non-interactive --json > update.json
          node -e '
            const u = require("./update.json").find((x) => x.platform === "ios") ?? require("./update.json")[0];
            const app = require("./app.json").expo;
            const link = `exp://u.expo.dev/${app.extra.eas.projectId}/group/${u.group}`;
            const qr = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(link)}`;
            const fs = require("fs");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## افتحيه في Expo Go\n\n![QR](${qr})\n\nامسحي الكود بكاميرا الآيفون، أو افتحي اللينك ده على الموبايل:\n\n${link}\n`);
            console.log(link);
          '
