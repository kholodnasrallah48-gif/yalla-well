# Web version of the app for friends to try in the browser: built on every push to main and published to the
# gh-pages branch (GitHub Pages serves it at https://kholodnasrallah48-gif.github.io/yalla-well/). The website about
# the app (website/) is built into the same branch under /site/.
name: Web version
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: web
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo export -p web
        env:
          EXPO_PUBLIC_USDA_KEY: ${{ secrets.USDA_KEY }}
      - run: node website/build.mjs dist/site
      # Pages skips folders starting with "_" (like _expo) unless Jekyll is off; 404.html serves app routes.
      - run: touch dist/.nojekyll && cp dist/index.html dist/404.html
      - run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Web version ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
