# The website about the app and the web version of the app, built on every push to main and published to the
# gh-pages branch. GitHub Pages serves it on the custom domain (CNAME): the website at https://yallawellfit.com/
# and the app at https://yallawellfit.com/app/.
name: Web version
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: web
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node website/build.mjs dist
      - run: npx expo export -p web --output-dir dist/app
        env:
          EXPO_PUBLIC_USDA_KEY: ${{ secrets.USDA_KEY }}
          # Sign-in (optional): the project URL and its public key; without them the app has no account parts.
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_KEY }}
      # Pages skips folders starting with "_" (like _expo) unless Jekyll is off; 404.html serves app routes and
      # sends old links (/site/..., app routes without /app) to their new place.
      - run: node scripts/pages-404.mjs dist && echo yallawellfit.com > dist/CNAME
      - run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Web version ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
